spring.application.name=badges-app

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/badgesapp}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Keycloak resource server and admin client
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/ram}
keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8081}
keycloak.admin-realm=${KEYCLOAK_ADMIN_REALM:master}
keycloak.target-realm=${KEYCLOAK_TARGET_REALM:ram}
keycloak.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID:ram-admin}
keycloak.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:}
app.keycloak.sync-on-startup=${KEYCLOAK_SYNC_ON_STARTUP:true}

# Comma-separated origins allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
