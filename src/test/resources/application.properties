spring.datasource.url=jdbc:h2:mem:badgesapp;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/test
keycloak.server-url=http://localhost:8081
keycloak.admin-realm=master
keycloak.target-realm=test
keycloak.admin-client-id=test-admin
keycloak.client-secret=test-only
app.keycloak.sync-on-startup=false
app.cors.allowed-origins=http://localhost:5173
